<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tessier Real Estate Team | Countdown to the Prizes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /*
         * Entire presentation always fits inside
         * the visible browser window.
         */
        .screen {
            width: 100vw;
            height: 100vh;

            display: flex;
            flex-direction: column;

            background: #000;
            overflow: hidden;
        }

        /*
         * Image takes all remaining available space
         * above the countdown.
         */
        .hero-area {
            flex: 1 1 auto;
            min-height: 0;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            overflow: hidden;
        }

        .hero {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center top;
        }

        /*
         * Countdown has a controlled height.
         */
        .countdown-section {
            flex: 0 0 auto;

            width: 100%;

            /* Pull countdown closer to the banner */
            padding: 0 3vw 2vh;
            margin-top: -7vh;

            background: #000;
            text-align: center;

            position: relative;
        }

        .countdown {
            width: 100%;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            align-items: center;
        }

        .time-box {
            text-align: center;
        }

        .number {
            display: block;

            font-family: Georgia, "Times New Roman", serif;

            /*
             * Scales based on BOTH screen width
             * and screen height.
             */
            font-size: clamp(
                4rem,
                min(9vw, 13vh),
                10rem
            );

            line-height: 0.9;

            color: #fff0c9;

            text-shadow:
                0 0 8px rgba(255, 226, 170, 0.95),
                0 0 20px rgba(255, 184, 84, 0.65),
                0 0 40px rgba(255, 140, 20, 0.25);
        }

        .label {
            display: block;

            margin-top: 1.2vh;

            font-size: clamp(
                0.65rem,
                min(1.2vw, 1.8vh),
                1.2rem
            );

            font-weight: 500;

            letter-spacing: 0.35em;

            color: #e4c58e;
        }

        .draw-time {
            margin-top: 4vh;

            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(
                0.8rem,
                min(1.5vw, 2.2vh),
                1.5rem
            );

            letter-spacing: 0.18em;

            color: #e4c58e;
        }

        /*
         * Phone layout
         */
        @media (max-width: 650px) {

            html,
            body {
                overflow: auto;
            }

            .screen {
                min-height: 100vh;
                height: auto;
            }

            .hero-area {
                flex: none;
            }

            .hero {
                width: 100%;
                height: auto;
            }

            .countdown-section {
                padding: 15px 8px 25px;
            }

            .number {
                font-size: 13vw;
            }

            .label {
                font-size: 2.3vw;
                letter-spacing: 0.1em;
            }

            .draw-time {
                margin-top: 25px;
                font-size: 3vw;
            }
        }
    </style>
</head>

<body>

<div class="screen">

    <div class="hero-area">

        <img
            src="party.jpeg"
            alt="Tessier Real Estate Team Annual Client Party"
            class="hero"
        >

    </div>

    <section class="countdown-section">

        <div class="countdown">

            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">DAYS</span>
            </div>

            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">HOURS</span>
            </div>

            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">MINUTES</span>
            </div>

            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">SECONDS</span>
            </div>

        </div>

        <div class="draw-time">
            DRAW • OCTOBER 3, 2026 • 11:00 PM
        </div>

    </section>

</div>

<script>

    const drawTime =
        new Date("2026-10-03T23:00:00-04:00").getTime();

    function updateCountdown() {

        const now = Date.now();
        const distance = drawTime - now;

        const countdown =
            document.querySelector(".countdown");

        const daysBox =
            document.getElementById("days").closest(".time-box");

        const hoursBox =
            document.getElementById("hours").closest(".time-box");

        const minutesBox =
            document.getElementById("minutes").closest(".time-box");

        const secondsBox =
            document.getElementById("seconds").closest(".time-box");


        /* DRAW TIME */

        if (distance <= 0) {

            countdown.innerHTML =
                '<div class="draw-now">IT\'S TIME TO DRAW!</div>';

            document.querySelector(".draw-time").style.display = "none";

            return;
        }


        const days = Math.floor(
            distance / (1000 * 60 * 60 * 24)
        );

        const hours = Math.floor(
            (distance % (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );

        const minutes = Math.floor(
            (distance % (1000 * 60 * 60)) /
            (1000 * 60)
        );

        const seconds = Math.floor(
            (distance % (1000 * 60)) /
            1000
        );


        /* MORE THAN 24 HOURS */

        if (days > 0) {

            daysBox.style.display = "block";
            hoursBox.style.display = "block";

            countdown.style.gridTemplateColumns =
                "repeat(4, 1fr)";
        }


        /* LESS THAN 24 HOURS */

        else if (hours > 0) {

            daysBox.style.display = "none";
            hoursBox.style.display = "block";

            countdown.style.gridTemplateColumns =
                "repeat(3, 1fr)";
        }


        /* LESS THAN 1 HOUR */

        else {

            daysBox.style.display = "none";
            hoursBox.style.display = "none";

            countdown.style.gridTemplateColumns =
                "repeat(2, 1fr)";
        }


        document.getElementById("days").textContent =
            String(days).padStart(2, "0");

        document.getElementById("hours").textContent =
            String(hours).padStart(2, "0");

        document.getElementById("minutes").textContent =
            String(minutes).padStart(2, "0");

        document.getElementById("seconds").textContent =
            String(seconds).padStart(2, "0");
    }


    updateCountdown();

    setInterval(updateCountdown, 1000);

</script>

</body>
</html>
