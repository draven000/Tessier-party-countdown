<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tessier Real Estate Team | Countdown to the Prizes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #f6dfb2;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            text-align: center;
            background: #000;
        }

        .hero {
            display: block;
            width: 100%;
            height: auto;
        }

        .countdown-section {
            width: 100%;
            padding: 0 3% 40px;
            margin-top: -35px;
            background: #000;
            position: relative;
        }

        .countdown {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: start;
        }

        .time-box {
            width: 100%;
            text-align: center;
        }

        .number {
            display: block;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(5rem, 10vw, 10rem);
            font-weight: normal;
            line-height: 0.95;
            color: #fff0c9;

            text-shadow:
                0 0 8px rgba(255, 226, 170, 0.95),
                0 0 20px rgba(255, 184, 84, 0.65),
                0 0 40px rgba(255, 140, 20, 0.25);
        }

        .label {
            display: block;
            margin-top: 18px;

            font-size: clamp(0.8rem, 1.25vw, 1.25rem);
            font-weight: 500;

            letter-spacing: 0.4em;

            color: #e4c58e;
        }

        .draw-time {
            margin-top: 40px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(1rem, 1.8vw, 1.7rem);

            letter-spacing: 0.18em;

            color: #e4c58e;
        }

        @media (max-width: 700px) {

            .countdown-section {
                margin-top: -10px;
                padding-left: 10px;
                padding-right: 10px;
            }

            .number {
                font-size: clamp(3.2rem, 16vw, 6rem);
            }

            .label {
                font-size: 0.65rem;
                letter-spacing: 0.12em;
                margin-top: 10px;
            }

            .draw-time {
                margin-top: 30px;
                font-size: 0.9rem;
                line-height: 1.6;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            src="party.jpeg"
            alt="Tessier Real Estate Team Annual Client Party"
            class="hero"
        >

        <section class="countdown-section">

            <div class="countdown">

                <div class="time-box">
                    <span class="number" id="days">00</span>
                    <span class="label">DAYS</span>
                </div>

                <div class="time-box">
                    <span class="number" id="hours">00</span>
                    <span class="label">HOURS</span>
                </div>

                <div class="time-box">
                    <span class="number" id="minutes">00</span>
                    <span class="label">MINUTES</span>
                </div>

                <div class="time-box">
                    <span class="number" id="seconds">00</span>
                    <span class="label">SECONDS</span>
                </div>

            </div>

            <div class="draw-time">
                DRAW • OCTOBER 3, 2026 • 11:00 PM
            </div>

        </section>

    </div>

    <script>

        // October 3, 2026 at 11:00 PM Eastern Daylight Time
        const drawTime =
            new Date("2026-10-03T23:00:00-04:00").getTime();

        function updateCountdown() {

            const now = Date.now();
            const distance = drawTime - now;

            if (distance <= 0) {

                document.getElementById("days").textContent = "00";
                document.getElementById("hours").textContent = "00";
                document.getElementById("minutes").textContent = "00";
                document.getElementById("seconds").textContent = "00";

                return;
            }

            const days = Math.floor(
                distance / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (distance % (1000 * 60 * 60 * 24)) /
                (1000 * 60 * 60)
            );

            const minutes = Math.floor(
                (distance % (1000 * 60 * 60)) /
                (1000 * 60)
            );

            const seconds = Math.floor(
                (distance % (1000 * 60)) /
                1000
            );

            document.getElementById("days").textContent =
                String(days).padStart(2, "0");

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);

    </script>

</body>
</html>
